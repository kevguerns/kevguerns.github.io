<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FAA Pinaghalong Pamana Check-in</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #ded8be; }
    .info-box { margin-top: 20px; padding: 15px; border-radius: 8px; background: #ce8525; box-shadow: 0 0 5px rgba(0,0,0,0.1); }
    .hidden { display: none; }
    #reader { margin: auto; }
  </style>
</head>
<body>
  <h1>FAA Pinaghalong Pamana Check-in v0.4</h1>
  <div id="reader" style="width: 500px;"></div>

  <div id="debug"></div>
  
  <div id="guest-info" class="info-box hidden">
    <p><strong>Name:</strong> <span id="name"></span></p>
    <p><strong>Table:</strong> <span id="table"></span></p>
    <p><strong>Paid:</strong> <span id="paid"></span></p>
    <p><strong>Checked In:</strong> <span id="checked-status"></span></p>
    <p>
      <label>
        <input type="checkbox" id="checked-in"> Mark as Checked In
      </label>
    </p>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbxkRgjs1VtwPjtLVZmtFnTdSXYVLf8RuIRotRwws8SJ3KcYXiS2ahKUOoYtFIIi-6P9fg/exec"; // Replace with Apps Script Web App URL
    let ticketData = [];
    let currentTicket = null;

    // Load ticket data from Google Sheets
    function loadData() {
      console.log("Loading data.")
      fetch(API_URL)
        .then(res => res.json())
        .then(data => {
          ticketData = data;
        });
      console.log("Data loaded.")
    }

    function showGuestInfo(ticketNum) {
      const guest = ticketData.find(t => String(t.ticket_number) === String(ticketNum));
      if (guest) {
        currentTicket = guest.ticket_number;
        document.getElementById("guest-info").classList.remove("hidden");
        document.getElementById("name").textContent = guest.first_name + " " + guest.last_name;
        document.getElementById("table").textContent = guest.table_num;
        document.getElementById("paid").textContent = guest.paid_bool;

        const statusEl = document.getElementById("checked-status");
        const checkBox = document.getElementById("checked-in");

        if (guest.checked_in === "Yes") {
          statusEl.textContent = "Yes";
          statusEl.className = "checked";
          checkBox.checked = true;
        } else {
          statusEl.textContent = "No";
          statusEl.className = "not-checked";
          checkBox.checked = false;
        }

        // Checkbox handler
        checkBox.onchange = () => {
          if (checkBox.checked) {
            const newURL = API_URL + "?update=True&ticket_number=" + guest.ticket_number;
            console.log(newURL);
            fetch(newURL)
            .then(() => {
              // Refresh data and update display immediately
              loadData(() => showGuestInfo(guest.ticket_number));
            })
            .then(alert(guest.ticket_number))
            .catch(err => console.error("Error checking in:", err));
          }
        };
      } else {
        alert("Ticket " + ticketNum + " not found.");
      }
    }

    function qrCodeSuccessCallback(decodedText) {
      showGuestInfo(decodedText.trim());
    }

    const html5QrcodeScanner = new Html5QrcodeScanner(
      "reader", { fps: 10, qrbox: 250 });
    html5QrcodeScanner.render(qrCodeSuccessCallback);

    loadData();
    console.log(ticketData);
  </script>
</body>
</html>
