<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FAA Pinaghalong Pamana Check-in</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <link rel="stylesheet" href="index.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
</head>
<body>
  <h1 class="libre-baskerville-regular-italic">Pinaghalong Pamana Check-In v0.6</h1>
  <div id="banner">Ticket is being checked in!</div>
  <div id="reader" style="width: 500px;"></div>

  <div id="debug"></div>
  
  <div id="guest-info" class="info-box hidden">
    <p><strong>Name:</strong> <span id="name"></span></p>
    <p><strong>Table:</strong> <span id="table"></span></p>
    <p><strong>Paid:</strong> <span id="paid"></span></p>
    <p><strong>Checked In:</strong> <span id="checked-status"></span></p>
    <p>
      <button id="check-in-btn">Mark as Checked In</button>
    </p>
  </div>

  <script src="scripts.js"></script>
</body>
</html>
